$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'kotlin'
layer: 'library'

fileGroups:
  gradle:
    - 'build.gradle.kts'
    - 'settings.gradle.kts'
    - 'gradle.properties'
    - 'gradle/**/*'
    - 'gradlew'
    - 'gradlew.bat'
    - 'buildSrc/**/*'
  focusedSources:
    - 'readium/shared/**/*'
    - 'readium/streamer/**/*'
    - 'readium/navigator/**/*'

tasks:
  navigator-compile:
    script: |
      ./gradlew \
        :readium:readium-shared:compileDebugKotlin \
        :readium:readium-streamer:compileDebugKotlin \
        :readium:readium-navigator:compileDebugKotlin
    inputs:
      - '@globs(gradle)'
      - '@globs(focusedSources)'
    options:
      cache: false

  focused-check:
    script: |
      ./gradlew \
        :readium:readium-shared:check \
        :readium:readium-streamer:check \
        :readium:readium-navigator:check
    inputs:
      - '@globs(gradle)'
      - '@globs(focusedSources)'
    options:
      cache: false
